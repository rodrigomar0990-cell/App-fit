<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<style>:root{color-scheme:dark;background:#0A0A0B;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fierro y Balanza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola columna tipo app de celular, tarjetas por tema, barra de navegación fija abajo */
:root {
  /* Negro y dorado: una sola apariencia oscura, el dorado marca lo importante */
  --bg: #0A0A0B;
  --surface: #141416;
  --surface-2: #1C1C1F;
  --ink: #F3EEE2;
  --muted: #9E988A;
  --line: #2A2926;
  --accent: #D8B24A;
  --accent-soft: #2C2512;
  --on-accent: #0A0A0B;
  --good: #7BCB8B;
  --good-soft: #17281C;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: .01em; text-transform: uppercase; }
h2 { font-family: var(--display); font-weight: 600; font-size: 21px; letter-spacing: .02em; text-transform: uppercase; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-top: 4px; }
.top .sub { color: var(--muted); font-size: 13px; }
.top .sub::first-letter { text-transform: uppercase; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.big { font-size: 46px; }
.big small { font-size: 20px; font-weight: 600; margin-left: 2px; color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .num { font-size: 26px; }
.stat .lbl { font-size: 12px; color: var(--muted); }

button, .btn {
  font: inherit; font-weight: 600; border: 0; border-radius: 11px; padding: 11px 16px; cursor: pointer;
  background: var(--surface-2); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary { background: var(--accent); color: var(--on-accent); }
.ghost { background: transparent; color: var(--accent); padding: 6px 8px; }
.danger { background: transparent; color: var(--muted); }
.danger[data-armed] { color: var(--accent); background: var(--accent-soft); }
.block { width: 100%; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.hot { background: var(--accent-soft); color: var(--accent); }

label.f { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--muted); min-width: 0; }
input, select, textarea {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0;
}
input::placeholder { color: var(--muted); opacity: .7; }

/* semana / racha */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); font-weight: 600; }
.dot { width: 100%; max-width: 38px; aspect-ratio: 1; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; }
.dot.on { background: var(--accent); border: 2px solid var(--accent); color: var(--on-accent); }
.dot.today { border-style: solid; border-color: var(--ink); }
.dot.on.today { border-color: var(--accent); }
.streak { display: flex; align-items: baseline; gap: 10px; }
.streak .num { font-size: 56px; color: var(--accent); }

.bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.good > i { background: var(--good); }
.goal { display: flex; flex-direction: column; gap: 6px; }
.goal .row { justify-content: space-between; }

.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li .grow p { overflow-wrap: anywhere; }

/* chart */
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .ar { fill: var(--accent); opacity: .12; }
.chart .pt { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .end { fill: var(--accent); }
.chart .endlbl { fill: var(--ink); font-weight: 700; font-size: 12px; }
.chart .gl { stroke: var(--good); stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart .gllbl { fill: var(--good); font-weight: 600; }
.chart-empty { background: var(--surface-2); border-radius: 10px; padding: 26px 16px; text-align: center; color: var(--muted); font-size: 13px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { padding: 6px 11px; font-size: 13px; background: transparent; color: var(--muted); border-radius: 8px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

/* empty */
.empty { text-align: center; padding: 22px 12px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty p { color: var(--muted); max-width: 34ch; }

/* gym */
.rut { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--surface-2); }
.rut .grow h3 { overflow-wrap: anywhere; }
.ex { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.ex:first-of-type { border-top: 0; padding-top: 0; }
.ex-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.ex-head h3 { overflow-wrap: anywhere; }
.set { display: grid; grid-template-columns: 26px 1fr 1fr 46px; gap: 8px; align-items: center; }
.set .n { font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--muted); text-align: center; }
.set input { text-align: center; padding: 9px 6px; font-variant-numeric: tabular-nums; }
.set button { padding: 0; height: 42px; border-radius: 10px; border: 2px solid var(--line); background: transparent; color: var(--muted); }
.set.ok input { background: var(--good-soft); border-color: transparent; }
.set.ok button { background: var(--good); border-color: var(--good); color: var(--surface); }
.set-h { display: grid; grid-template-columns: 26px 1fr 1fr 46px; gap: 8px; font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; letter-spacing: .05em; text-transform: uppercase; }
.timer { font-family: var(--display); font-weight: 700; font-size: 28px; font-variant-numeric: tabular-nums; }
.sess-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.erow { display: grid; grid-template-columns: 1fr 64px 64px 38px; gap: 6px; align-items: end; }
.erow input { padding: 9px 8px; }
.erow button { height: 42px; padding: 0; }
details.hist summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
details.hist summary::-webkit-details-marker { display: none; }
details.hist .det { padding-top: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }

/* fotos */
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.thumb { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 3/4; background: var(--surface-2); padding: 0; max-width: 100%; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb span { position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-weight: 600; background: rgba(0,0,0,.6); color: #fff; padding: 2px 7px; border-radius: 99px; }
.compare { position: relative; width: 100%; max-width: 100%; aspect-ratio: 3/4; border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.compare .tag { position: absolute; top: 8px; font-size: 12px; font-weight: 600; background: rgba(0,0,0,.6); color: #fff; padding: 3px 9px; border-radius: 99px; }
.compare .divider { position: absolute; top: 0; bottom: 0; width: 3px; background: #fff; box-shadow: 0 0 6px rgba(0,0,0,.5); transform: translateX(-50%); pointer-events: none; }
input[type=range] { padding: 0; border: 0; background: transparent; accent-color: var(--accent); }
.upl { border: 2px dashed var(--line); border-radius: 12px; padding: 16px; text-align: center; cursor: pointer; color: var(--muted); font-weight: 600; display: block; }
.upl input { display: none; }

/* nav */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button { flex-direction: column; gap: 3px; background: transparent; color: var(--muted); font-size: 11px; padding: 9px 4px 10px; border-radius: 0; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

/* sheet + toast */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); border-top: 1px solid var(--accent); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 18px 18px 0 0;
  padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.sheet img.full { width: 100%; border-radius: 12px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); padding: 11px 18px; border-radius: 12px; font-weight: 600; font-size: 14px;
  max-width: calc(100% - 32px); text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.25);
}
.toast.pr { background: var(--accent); color: var(--on-accent); }
.note { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
/* descanso, medallas, ánimo, resumen */
.rest {
  position: fixed; left: 0; right: 0; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; justify-content: center; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.rest .in { pointer-events: auto; width: 100%; max-width: 528px; background: var(--surface-2); color: var(--ink); border: 1px solid var(--accent); border-radius: 14px; padding: 9px 10px 9px 14px; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.rest .t { color: var(--accent); font-family: var(--display); font-weight: 700; font-size: 30px; font-variant-numeric: tabular-nums; min-width: 64px; }
.rest.fin .in { background: var(--accent); color: var(--on-accent); }
.rest.fin .t { color: var(--on-accent); }
.rest button { background: rgba(127,127,127,.28); color: inherit; padding: 8px 12px; }
.medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.medal { display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; padding: 10px 6px; border-radius: 12px; background: var(--surface-2); font-size: 11px; line-height: 1.25; color: var(--muted); }
.medal .m { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 16px; border: 2px dashed var(--line); }
.medal.on { color: var(--ink); }
.medal.on .m { background: var(--accent); border: 2px solid var(--accent); color: var(--on-accent); }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.opts button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pair figure { margin: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); text-align: center; min-width: 0; }
.pair img { width: 100%; max-width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px; }
.note.row { align-items: center; }
/* plan, cardio, calendario, notas, discos, cámara, evolución, compartir, informe */
.plan { display: flex; flex-direction: column; gap: 6px; }
.plan-row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; align-items: center; font-size: 14px; }
.plan-row.hoy span { color: var(--accent); font-weight: 600; }
.plan-row select { padding: 8px 10px; }
.heat { overflow-x: auto; direction: rtl; padding-bottom: 4px; }
.heat svg { direction: ltr; display: block; }
.heat text { fill: var(--muted); font-size: 9px; font-family: var(--body); }
.hg { fill: var(--accent); }
.hc { fill: var(--accent); fill-opacity: .4; }
.h0 { fill: var(--surface-2); }
.lg { display: inline-block; width: 11px; height: 11px; border-radius: 2px; vertical-align: middle; }
.lg.hg { background: var(--accent); }
.lg.hc { background: var(--accent); opacity: .4; }
.lg.h0 { background: var(--surface-2); border: 1px solid var(--line); }
.nota { background: var(--accent-soft); border-radius: 8px; padding: 7px 10px; overflow-wrap: anywhere; }
textarea { resize: vertical; }
button.medal { font-weight: 400; cursor: pointer; }
.barra { display: flex; align-items: center; gap: 3px; min-height: 150px; overflow-x: auto; padding-block: 6px; }
.barra .eje { flex: none; width: 46px; height: 10px; background: var(--muted); border-radius: 3px; }
.disco { flex: none; width: 28px; border-radius: 5px; background: var(--accent); color: var(--on-accent); font-family: var(--display); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; transform: rotate(180deg); }
.cam { position: fixed; inset: 0; z-index: 70; background: #000; }
.cam video, .cam .guia { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cam .guia { pointer-events: none; }
.espejo { transform: scaleX(-1); }
.cam button { background: rgba(0,0,0,.55); color: #fff; }
.cam-top {
  position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px));
}
.cam-top .pill { background: rgba(0,0,0,.55); color: var(--accent); white-space: normal; text-align: center; }
.cam-bot {
  position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; color: #fff;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(transparent, rgba(0,0,0,.65));
}
.cam-bot label { display: flex; flex-direction: column; gap: 4px; }
.cam-bot > :last-child { justify-self: end; }
.cam .disparo { width: 76px; height: 76px; padding: 0; border-radius: 50%; background: var(--accent); border: 4px solid #fff; }
.cam-cuenta { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 150px; color: var(--accent); text-shadow: 0 4px 30px rgba(0,0,0,.6); pointer-events: none; }
.evo { position: relative; width: 100%; max-width: 100%; aspect-ratio: 3/4; border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.evo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.evo .tag { position: absolute; left: 8px; bottom: 8px; font-size: 13px; font-weight: 600; background: rgba(0,0,0,.65); color: var(--accent); padding: 4px 10px; border-radius: 99px; }
.share-img { max-height: 55vh; width: auto; align-self: center; border: 1px solid var(--line); }
a.btn { text-decoration: none; }
.informe { display: flex; flex-direction: column; gap: 14px; }
.solo-print { display: none; }
@media print {
  :root { --bg: #fff; --surface: #fff; --surface-2: #f3f1ea; --ink: #111; --muted: #555; --line: #ddd; --accent: #8a6d12; --accent-soft: #f4ecd2; color-scheme: light; }
  body > *:not(.scrim) { display: none !important; }
  body::before { display: none; }
  .scrim { position: static; background: none; display: block; }
  .sheet { max-height: none; overflow: visible; border: 0; box-shadow: none; animation: none; }
  .no-print, .toast { display: none !important; }
  .solo-print { display: block; }
}
.set.aprox .n, .set.drop .n { font-size: 15px; }
.set.aprox .n { color: var(--muted); }
.set.aprox input { border-style: dashed; }
.set.drop .n { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: up .25s ease-out; }
  .sheet { animation: up .22s ease-out; }
  @keyframes up { from { transform: translate(var(--tx, 0), 14px); opacity: 0; } }
  .toast { --tx: -50%; }
}
</style>

</head>
<body>
<main class="wrap" id="app"></main>

<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <button data-act="go" data-v="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button data-act="go" data-v="peso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 9a5 5 0 0 1 8 0"/><path d="M12 9l1.5-2"/></svg>Peso</button>
    <button data-act="go" data-v="gym"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>Gimnasio</button>
    <button data-act="go" data-v="fotos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Fotos</button>
  </div>
</nav>

<script>
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function apiFetch(path, opts = {}) {
  let r;
  try { r = await fetch(path, { credentials: "same-origin", ...opts }); } catch { throw { code: "red" }; }
  if (r.status === 401 && !path.endsWith("/login")) { estado = "login"; render(); throw { code: "login" }; }
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw { code: r.status, message: e.error }; }
  return r.json();
}
const Store = {
  put: (c, id, data) => apiFetch(`/api/r/${c}/${id}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) }),
  del: (c, id) => apiFetch(`/api/r/${c}/${id}`, { method: "DELETE" })
};
const assets = {
  upload: blob => apiFetch("/api/foto", { method: "POST", headers: { "Content-Type": blob.type || "image/jpeg" }, body: blob }),
  delete: id => apiFetch(`/api/foto/${id}`, { method: "DELETE" })

const sortAll = () => {
  S.pesos.sort((a, b) => a.fecha.localeCompare(b.fecha) || (a.creado || 0) - (b.creado || 0));
  S.fotos.sort((a, b) => a.fecha.localeCompare(b.fecha));
  S.sesiones.sort((a, b) => a.fecha.localeCompare(b.fecha) || (a.inicio || 0) - (b.inicio || 0));
  S.rutinas.sort((a, b) => (a.creado || 0) - (b.creado || 0));

/* Sin señal: los cambios quedan en una cola en el celular y se suben solos cuando vuelve la conexión */
const cola = { get: () => ls.get("cola", []), set: q => ls.set("cola", q) };
let subiendo = false;
function guardarCopia() {
  ls.set("copia", { pesos: S.pesos, sesiones: S.sesiones, rutinas: S.rutinas, fotos: S.fotos, cardio: S.cardio, notas: S.notas, ejercicios: S.ejercicios, ajustes: { general: S.cfg }, guardada: Date.now() });
}
async function escribir(op, c, id, data) {
  guardarCopia();
  if (!cola.get().length) {
    try { op === "put" ? await Store.put(c, id, data) : await Store.del(c, id); return; }
    catch (e) { if (e?.code !== "red") throw e; }
  }
  cola.set([...cola.get(), { op, c, id, data }]);
  const ok = await vaciarCola();
  if (!ok) toast("Sin señal: quedó guardado en el celular y se sube solo cuando vuelva la conexión.", "offline");
}
async function vaciarCola() {
  if (subiendo) return false;
  subiendo = true;
  try {
    while (cola.get().length) {
      const o = cola.get()[0];
      try { o.op === "put" ? await Store.put(o.c, o.id, o.data) : await Store.del(o.c, o.id); }
      catch (e) { if (e?.code === "red" || e?.code === "login" || !(e?.code >= 400 && e?.code < 500)) throw e; }
      cola.set(cola.get().slice(1));
    }
    return true;
  } catch { return false; }
  finally { subiendo = false; }
}
function aplicarCola() {
  for (const o of cola.get()) {
    if (o.c === "ajustes") { if (o.op === "put") S.cfg = { ...S.cfg, ...o.data }; continue; }
    const arr = S[o.c]; if (!arr) continue;
    const i = arr.findIndex(x => x.id === o.id);
    if (o.op === "del") { if (i >= 0) arr.splice(i, 1); }
    else if (i >= 0) arr[i] = { id: o.id, ...o.data }; else arr.push({ id: o.id, ...o.data });
  }
}
async function guardar(c, obj) {
  const { id, ...data } = obj;
  const arr = S[c], i = arr.findIndex(x => x.id === id);
  if (i >= 0) arr[i] = obj; else arr.push(obj);
  sortAll();
  try { await escribir("put", c, id, data); }
  catch (e) { if (e?.code !== "login") toast("No se pudo guardar. Probá de nuevo."); throw e; }
}
async function borrar(c, id) {
  S[c] = S[c].filter(x => x.id !== id);
  try { await escribir("del", c, id); } catch (e) { if (e?.code !== "login") toast("No se pudo borrar. Probá de nuevo."); }
}
async function guardarCfg() {
  try { await escribir("put", "ajustes", "general", S.cfg); }
  catch (e) { if (e?.code !== "login") toast("No se pudieron guardar los objetivos."); }
}

/* ---------- cálculos ---------- */
const diasEntrenados = () => new Set([...S.sesiones.map(s => s.fecha), ...S.cardio.map(c => c.fecha)]);
function racha() {
  const meta = S.cfg.diasSemana || 3, porSemana = {};
  diasEntrenados().forEach(f => { const k = ymd(lunes(parseYmd(f))); porSemana[k] = (porSemana[k] || 0) + 1; });
  let w = lunes(new Date()), n = 0;
  const esta = porSemana[ymd(w)] || 0;
  if (esta >= meta) n++;
  w.setDate(w.getDate() - 7);
  while ((porSemana[ymd(w)] || 0) >= meta) { n++; w.setDate(w.getDate() - 7); }
  return { n, esta, meta };
}
function semanaActual() {
  const l = lunes(new Date()), k0 = ymd(l), ses = S.sesiones.filter(s => s.fecha >= k0);
  let vol = 0, series = 0;
  ses.forEach(s => s.ejercicios.forEach(e => e.series.filter(contable).forEach(x => { series++; vol += (x.kg || 0) * (x.reps || 0); })));
  const cardioMin = S.cardio.filter(c => c.fecha >= k0).reduce((a, c) => a + (c.minutos || 0), 0);
  return { sesiones: ses.length, vol, series, cardioMin };
}
const nombresEjercicios = () => {
  const set = new Set();
  S.rutinas.forEach(r => r.ejercicios.forEach(e => set.add(e.nombre)));
  S.sesiones.forEach(s => s.ejercicios.forEach(e => set.add(e.nombre)));
  return [...set].filter(Boolean).sort((a, b) => a.localeCompare(b, "es"));
};
const mismo = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
function ultimaVez(nombre) {
  for (let i = S.sesiones.length - 1; i >= 0; i--) {
    const e = S.sesiones[i].ejercicios.find(x => mismo(x.nombre, nombre));
    if (e) return { fecha: S.sesiones[i].fecha, series: e.series };
  }
  return null;
}
function mejor(nombre, sesiones = S.sesiones) {
  let best = null;
  sesiones.forEach(s => s.ejercicios.forEach(e => {
    if (!mismo(e.nombre, nombre)) return;
    e.series.filter(contable).forEach(x => { if (best === null || x.kg > best.kg || (x.kg === best.kg && x.reps > best.reps)) best = { kg: x.kg, reps: x.reps, fecha: s.fecha }; });
  }));
  return best;
}
const rm1 = (kg, reps) => reps <= 1 ? kg : kg * (1 + reps / 30);
function mejorTiempo(nombre) {
  let best = null;
  S.sesiones.forEach(s => s.ejercicios.forEach(e => {
    if (!mismo(e.nombre, nombre)) return;
    e.series.forEach(x => { if (x.seg && (!best || x.seg > best.seg)) best = { seg: x.seg, kg: x.kg, fecha: s.fecha }; });
  }));
  return best;
}
const fmtSeg = n => n >= 60 ? `${Math.floor(n / 60)}:${String(n % 60).padStart(2, "0")} min` : `${n} s`;
const fmtMarca = x => x.seg ? `${fmtSeg(x.seg)}${x.kg ? ` · ${fmtKg(x.kg)} kg` : ""}` : `${fmtKg(x.kg)} kg × ${x.reps}`;
const fmtMarcaCorta = x => x.seg ? fmtSeg(x.seg) : `${fmtKg(x.kg)} kg`;
function promediosSemanales() {
  const g = {};
  S.pesos.forEach(p => { const k = ymd(lunes(parseYmd(p.fecha))); (g[k] ||= []).push(p.kg); });
  return Object.keys(g).sort().map(k => ({ semana: k, kg: g[k].reduce((a, b) => a + b, 0) / g[k].length, n: g[k].length }));
}
function mejorRacha() {
  const meta = S.cfg.diasSemana || 3, c = {};
  diasEntrenados().forEach(f => { const k = ymd(lunes(parseYmd(f))); c[k] = (c[k] || 0) + 1; });
  let best = 0, run = 0, prev = null;
  Object.keys(c).filter(k => c[k] >= meta).sort().forEach(k => {
    const d = parseYmd(k);
    run = prev && Math.round((d - prev) / (7 * 864e5)) === 1 ? run + 1 : 1;
    best = Math.max(best, run); prev = d;
  });
  return best;
}
function medallas() {
  const ses = S.sesiones.length, prs = S.sesiones.reduce((a, s) => a + (s.prs?.length || 0), 0), mr = mejorRacha();
  const p = S.pesos, sube = !!(S.cfg.pesoMeta && p.length && S.cfg.pesoMeta > p[0].kg);
  const cambio = p.length > 1 ? (sube ? Math.max(...p.map(x => x.kg)) - p[0].kg : p[0].kg - Math.min(...p.map(x => x.kg))) : 0;
  const porMes = {}; S.sesiones.forEach(s => { const k = s.fecha.slice(0, 7); porMes[k] = (porMes[k] || 0) + 1; });
  const maxMes = Math.max(0, ...Object.values(porMes));
  const f = S.fotos, spanFotos = f.length > 1 ? (parseYmd(f.at(-1).fecha) - parseYmd(f[0].fecha)) / 864e5 : 0;
  const s = sube ? "+" : "−", v = sube ? "Subiste" : "Bajaste";
  return [
    ["1", "Primer entrenamiento", ses >= 1], ["10", "10 entrenamientos", ses >= 10], ["25", "25 entrenamientos", ses >= 25],
    ["50", "50 entrenamientos", ses >= 50], ["100", "100 entrenamientos", ses >= 100], ["12", "Mes completo: 12 en un mes", maxMes >= 12],
    ["4S", "4 semanas de racha", mr >= 4], ["8S", "8 semanas de racha", mr >= 8], ["12S", "12 semanas de racha", mr >= 12],
    ["PR", "Primer récord", prs >= 1], ["10PR", "10 récords", prs >= 10],
    [s + "2", `${v} 2 kg`, cambio >= 2], [s + "5", `${v} 5 kg`, cambio >= 5], [s + "10", `${v} 10 kg`, cambio >= 10],
    ["F", "Primera foto", f.length >= 1], ["3M", "3 meses de fotos", spanFotos >= 84]
  ].map(([m, t, on]) => ({ m, t, on }));
}
const medallasOn = () => new Set(medallas().filter(m => m.on).map(m => m.t));

function tarjetaRendimiento() {
  const vol = s => s.ejercicios.reduce((a, e) => a + e.series.filter(contable).reduce((b, x) => b + x.kg * x.reps, 0), 0);
  const prom = arr => arr.reduce((a, s) => a + vol(s), 0) / arr.length;
  const filas = [];
  const bien = S.sesiones.filter(s => s.sueno >= 7), mal = S.sesiones.filter(s => s.sueno && s.sueno < 7);
  if (bien.length >= 2 && mal.length >= 2) filas.push(["Dormiste 7 h o más", prom(bien), bien.length], ["Dormiste menos de 7 h", prom(mal), mal.length]);
  ["alta", "media", "baja"].forEach(v => { const a = S.sesiones.filter(s => s.energia === v); if (a.length >= 2) filas.push([`Energía ${v}`, prom(a), a.length]); });
  const total = S.sesiones.filter(s => s.energia || s.sueno).length;
  if (!filas.length) return `<section class="card"><span class="eyebrow">Cómo rendís</span><p class="small muted">${total ? `Llevás ${total} entrenamiento${total > 1 ? "s" : ""} con energía o sueño anotado. ` : ""}Al terminar cada entrenamiento contá cómo te sentiste y cuánto dormiste. Con algunos registros vas a ver acá si rendís distinto.</p></section>`;
  const max = Math.max(...filas.map(f => f[1])) || 1;
  return `<section class="card"><span class="eyebrow">Cómo rendís</span><p class="small muted">Kilos levantados en promedio por entrenamiento (entre paréntesis, cuántos entrenamientos).</p>
    ${filas.map(([t, v, n]) => `<div class="goal"><div class="row small"><span>${t} <span class="muted">(${n})</span></span><b>${fmtKg(v)} kg</b></div><div class="bar"><i style="width:${v / max * 100}%"></i></div></div>`).join("")}</section>`;
}
const ejerciciosHechos = () => borrador.ejercicios
  .map(e => ({
    nombre: e.nombre.trim(), ...(e.tiempo ? { tiempo: true } : {}),
    series: e.series.filter(s => s.ok)
      .map(s => ({ ...(e.tiempo ? { kg: num(s.kg) || 0, reps: 0, seg: Math.round(num(s.reps) || 0) } : { kg: num(s.kg) || 0, reps: Math.round(num(s.reps) || 0) }), ...(s.tipo ? { tipo: s.tipo } : {}) }))
      .filter(s => s.reps > 0 || s.seg > 0)
  }))

const resumenSeries = series => {
  if (!series.length) return "";
  if (series.some(x => x.tipo)) {
    const base = series.filter(x => !x.tipo), nA = series.filter(x => x.tipo === "aprox").length, nD = series.filter(x => x.tipo === "drop").length;
    return [base.length ? resumenSeries(base) : "", nD ? `+ ${nD} drop${nD > 1 ? "s" : ""}` : "", nA ? `(${nA} de aproximación)` : ""].filter(Boolean).join(" ");
  }

    return series.map(x => fmtSeg(x.seg)).join(", ");
  }

/* ---------- gráfico ---------- */
function niceStep(r) { const p = 10 ** Math.floor(Math.log10(r)); const n = r / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function chart(pts, { goal = null, h = 190, unit = "kg", vacio = "Con dos registros ya ves la curva." } = {}) {
  if (pts.length < 2) return `<div class="chart-empty">${vacio}</div>`;
  const W = 340, H = h, pl = 34, pr = 44, pt = 12, pb = 22;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  if (goal != null) ys.push(goal);
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x0 === x1) { x0 -= 864e5; x1 += 864e5; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = Math.max((y1 - y0) * 0.12, 0.5); y0 -= pad; y1 += pad;
  const step = niceStep((y1 - y0) / 4); y0 = Math.floor(y0 / step) * step; y1 = Math.ceil(y1 / step) * step;
  const X = x => pl + (x - x0) / (x1 - x0) * (W - pl - pr);
  const Y = y => pt + (1 - (y - y0) / (y1 - y0)) * (H - pt - pb);
  let g = "";
  for (let v = y0; v <= y1 + step / 1e3; v += step) {
    g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl - 6}" y="${Y(v) + 3}" text-anchor="end">${fmtKg(v)}</text>`;
  }
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const area = `${line}L${X(pts.at(-1).x).toFixed(1)},${H - pb}L${X(pts[0].x).toFixed(1)},${H - pb}Z`;
  const dots = pts.length <= 40 ? pts.slice(0, -1).map(p => `<circle class="pt" cx="${X(p.x)}" cy="${Y(p.y)}" r="3"/>`).join("") : "";
  const last = pts.at(-1);
  const gl = goal != null ? `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${Y(goal)}" y2="${Y(goal)}"/><text class="gllbl" x="${W - pr + 4}" y="${Y(goal) + 3}">Meta</text>` : "";
  const fx = x => new Date(x).toLocaleDateString("es-UY", { day: "numeric", month: "short" });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución, último valor ${fmtKg(last.y)} ${unit}">
    ${g}${gl}<path class="ar" d="${area}"/><path class="ln" d="${line}"/>${dots}
    <circle class="end" cx="${X(last.x)}" cy="${Y(last.y)}" r="5"/>
    <text class="endlbl" x="${X(last.x) + 8}" y="${Y(last.y) + 4}">${fmtKg(last.y)}</text>
    <text x="${pl}" y="${H - 6}">${fx(x0)}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end">${fx(x1)}</text>
  </svg></div>`;
}

function toast(msg, cls = "") {
  // El aviso de "sin señal" no se pisa: el mensaje nuevo se suma adelante
  const sinSenal = document.querySelector(".toast.offline");
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast " + cls; t.textContent = msg;
  if (sinSenal && !cls.includes("offline")) { t.textContent = msg.replace(/\.$/, "") + ". " + sinSenal.textContent; t.classList.add("offline"); }
  document.body.appendChild(t); setTimeout(() => t.remove(), t.classList.contains("offline") ? 5000 : 3200);
}
function sheet(html) {

}

    : estado === "error" ? `<div class="note row"><span class="grow">Sin conexión: estás viendo lo guardado en el celular. Lo que anotes se sube cuando vuelva la señal.</span><button class="ghost" data-act="reintentar">Reintentar</button></div>` : "");
};

const V = {};

V.inicio = () => {
  const r = racha(), sem = semanaActual(), entr = diasEntrenados();
  const l = lunes(new Date()), letras = ["L", "M", "M", "J", "V", "S", "D"];
  const dias = letras.map((t, i) => { const d = new Date(l); d.setDate(l.getDate() + i); const k = ymd(d); return `<div class="day"><div class="dot ${entr.has(k) ? "on" : ""} ${k === hoy() ? "today" : ""}">${entr.has(k) ? "✓" : ""}</div>${t}</div>`; }).join("");
  const p = S.pesos, act = p.at(-1), ini = p[0];
  const meta = S.cfg.pesoMeta;
  let pesoHtml;
  if (!act) pesoHtml = `<div class="empty"><p>Todavía no anotaste tu peso. Cargalo después de cada control con el nutri.</p><button class="primary" data-act="nuevoPeso">Anotar peso</button></div>`;
  else {
    const dif = act.kg - ini.kg;
    let metaHtml = "";
    if (meta) {
      const tot = ini.kg - meta, hecho = ini.kg - act.kg, pct = tot === 0 ? 1 : Math.max(0, Math.min(1, hecho / tot));
      const falta = act.kg - meta;
      metaHtml = `<div class="goal"><div class="row small"><span>Meta ${fmtKg(meta)} kg</span><span class="muted">${Math.abs(falta) < 0.05 ? "¡Llegaste!" : `Faltan ${fmtKg(Math.abs(falta))} kg`}</span></div><div class="bar good"><i style="width:${pct * 100}%"></i></div></div>`;
    }
    pesoHtml = `<div class="row" style="justify-content:space-between;align-items:flex-end">
        <div><p class="num big">${fmtKg(act.kg)}<small>kg</small></p><p class="small muted">${fmtFecha(act.fecha, { day: "numeric", month: "long" })}</p></div>
        ${p.length > 1 ? `<span class="pill ${dif < 0 ? "good" : "hot"}">${dif > 0 ? "+" : dif < 0 ? "−" : ""}${fmtKg(Math.abs(dif))} kg desde el ${fmtFecha(ini.fecha)}</span>` : ""}
      </div>${chart(p.slice(-12).map(x => ({ x: +parseYmd(x.fecha), y: x.kg })), { h: 130, goal: meta })}${lineaPromedio()}${metaHtml}`;
  }
  const metas = (S.cfg.metas || []).filter(m => m.ejercicio && m.kg);
  const metasHtml = metas.length ? metas.map(m => {
    const b = mejor(m.ejercicio), v = b ? b.kg : 0, pct = Math.min(1, v / m.kg);
    return `<div class="goal"><div class="row small"><span><b>${esc(m.ejercicio)}</b></span><span class="muted">${fmtKg(v)} / ${fmtKg(m.kg)} kg</span></div><div class="bar ${pct >= 1 ? "good" : ""}"><i style="width:${pct * 100}%"></i></div></div>`;
  }).join("") : `<p class="small muted">Poné metas de peso y de ejercicios, por ejemplo "80 kg en sentadilla", y acá vas a ver cuánto te falta.</p>`;
  const prs = S.sesiones.flatMap(s => (s.prs || []).map(x => ({ ...x, fecha: s.fecha }))).slice(-4).reverse();
  return `
  <header class="top"><div><p class="sub">${new Date().toLocaleDateString("es-UY", { weekday: "long", day: "numeric", month: "long" })}</p><h1>Fierro <span style="color:var(--accent)">y</span> Balanza</h1></div></header>
  ${banner()}${recordatorioFoto()}
  <section class="card">
    <div class="card-head"><span class="eyebrow">Racha</span><span class="pill">${r.esta}/${r.meta} esta semana</span></div>
    <div class="streak"><span class="num">${r.n}</span><p>${r.n === 1 ? "semana seguida" : "semanas seguidas"} cumpliendo ${r.meta} días de gimnasio${r.esta < r.meta ? `<br><span class="small muted">${r.meta - r.esta === 1 ? "Te falta 1 día" : `Te faltan ${r.meta - r.esta} días`} para sumar esta semana.</span>` : ""}</p></div>
    <div class="week">${dias}</div>
    ${botonHoy()}
  </section>
  <section class="card">
    <div class="card-head"><span class="eyebrow">Peso</span>${act ? `<button class="ghost" data-act="nuevoPeso">+ Anotar</button>` : ""}</div>
    ${pesoHtml}
  </section>
  <section class="card">
    <span class="eyebrow">Esta semana</span>
    <div class="grid3">
      <div class="stat"><span class="num">${sem.sesiones}</span><span class="lbl">entrenamientos</span></div>
      <div class="stat"><span class="num">${sem.series}</span><span class="lbl">series</span></div>
      <div class="stat"><span class="num">${sem.vol >= 10000 ? fmtKg(sem.vol / 1000) + "t" : fmtKg(sem.vol)}</span><span class="lbl">kg levantados</span></div>
    </div>
    ${sem.cardioMin ? `<p class="small muted">Más ${sem.cardioMin} minutos de cardio.</p>` : ""}
    <button class="block" data-act="resumenMes">Ver resumen de ${new Date().toLocaleDateString("es-UY", { month: "long" })}</button>
  </section>
  <section class="card">
    <div class="card-head"><span class="eyebrow">Objetivos</span><button class="ghost" data-act="objetivos">Editar</button></div>
    ${metasHtml}
  </section>
  ${(() => { const med = medallas(); return `<section class="card"><div class="card-head"><span class="eyebrow">Medallas</span><span class="pill">${med.filter(m => m.on).length} de ${med.length}</span></div>
    <div class="medals">${med.map(m => m.on ? `<button class="medal on" data-act="compartirMedalla" data-m="${esc(m.m)}" data-t="${esc(m.t)}" aria-label="Compartir medalla ${esc(m.t)}"><span class="m">${esc(m.m)}</span>${esc(m.t)}</button>` : `<div class="medal"><span class="m">${esc(m.m)}</span>${esc(m.t)}</div>`).join("")}</div>
    ${med.some(m => m.on) ? `<p class="small muted">Tocá una medalla ganada para compartirla.</p>` : ""}</section>`; })()}
  ${prs.length ? `<section class="card"><span class="eyebrow">Últimos récords</span><div class="list">${prs.map(x => `<div class="li"><span class="pill hot">Récord</span><div class="grow"><p><b>${esc(x.ejercicio)}</b></p><p class="small muted">${fmtMarca(x)} · ${fmtFecha(x.fecha)}</p></div><button class="ghost small" data-act="compartirRecord" data-ej="${esc(x.ejercicio)}" data-kg="${x.kg}" data-reps="${x.reps}" data-seg="${x.seg || ""}" data-f="${x.fecha}">Compartir</button></div>`).join("")}</div></section>` : ""}
  `;
};

V.peso = () => {
  const p = S.pesos, meta = S.cfg.pesoMeta;
  const desde = { "1m": 31, "3m": 92, "todo": 1e5 }[pesoRango];
  const corte = ymd(new Date(Date.now() - desde * 864e5));
  const semanal = pesoModo === "semanal";
  const pts = semanal
    ? promediosSemanales().filter(w => w.semana >= ymd(lunes(parseYmd(corte)))).map(w => ({ x: +parseYmd(w.semana) + 3 * 864e5, y: w.kg }))
    : p.filter(x => x.fecha >= corte).map(x => ({ x: +parseYmd(x.fecha), y: x.kg }));
  const lista = [...p].reverse();
  return `
  <header class="top"><h1>Peso</h1></header>
  ${banner()}
  <section class="card">
    <span class="eyebrow">Nuevo registro</span>
    <form id="fPeso" class="grid2">
      <label class="f">Fecha<input type="date" id="pFecha" value="${hoy()}" max="${hoy()}" required></label>
      <label class="f">Peso (kg)<input id="pKg" inputmode="decimal" placeholder="${p.at(-1) ? fmtKg(p.at(-1).kg) : "75,4"}" required></label>
      <label class="f" style="grid-column:1/-1">Nota (opcional)<input id="pNota" placeholder="Ej.: control con el nutri"></label>
      <button class="primary" style="grid-column:1/-1" type="submit">Guardar peso</button>
    </form>
  </section>
  <section class="card">
    <div class="card-head"><span class="eyebrow">Evolución</span>
      <div class="seg">${[["1m", "1 mes"], ["3m", "3 meses"], ["todo", "Todo"]].map(([k, t]) => `<button data-act="rango" data-v="${k}" aria-pressed="${pesoRango === k}">${t}</button>`).join("")}</div>
    </div>
    <div class="seg" style="align-self:flex-start">${[["diario", "Cada registro"], ["semanal", "Promedio semanal"]].map(([k, t]) => `<button data-act="modoPeso" data-v="${k}" aria-pressed="${pesoModo === k}">${t}</button>`).join("")}</div>
    ${chart(pts, { goal: meta, vacio: semanal ? "Con pesos de dos semanas distintas ya ves la tendencia." : p.length < 2 ? "Con dos registros ya ves la curva." : "No hay registros en este período." })}
    ${semanal ? `<p class="small muted">El peso sube y baja de un día a otro por agua, sal o lo que comiste la noche anterior. El promedio de cada semana muestra la tendencia real.</p>` : ""}
  </section>
  <section class="card">
    <span class="eyebrow">Historial</span>
    ${lista.length ? `<div class="list">${lista.map((x, i) => {
      const prev = lista[i + 1], d = prev ? x.kg - prev.kg : null;
      return `<div class="li"><div class="grow"><p><b class="num" style="font-size:20px">${fmtKg(x.kg)} kg</b> ${d !== null && Math.abs(d) >= 0.05 ? `<span class="pill ${d < 0 ? "good" : "hot"}">${d > 0 ? "+" : "−"}${fmtKg(Math.abs(d))}</span>` : ""}</p><p class="small muted">${fmtFecha(x.fecha, { weekday: "short", day: "numeric", month: "short", year: "numeric" })}${x.nota ? " · " + esc(x.nota) : ""}</p></div><button class="danger small" data-act="borrarPeso" data-id="${x.id}" data-confirm>Borrar</button></div>`;
    }).join("")}</div>` : `<p class="small muted">Acá va a aparecer cada peso que anotes.</p>`}
  </section>`;
};

V.gym = () => {
  if (borrador) return vistaSesion();
  const nombres = nombresEjercicios();
  if (!ejSel || !nombres.some(n => mismo(n, ejSel))) ejSel = nombres.find(n => mejor(n)) || nombres[0] || null;
  const porTiempo = !!(ejSel && infoEj(ejSel).tiempo);
  const hist = S.sesiones.filter(s => s.ejercicios.some(e => mismo(e.nombre, ejSel || ""))).map(s => {
    const e = s.ejercicios.find(e => mismo(e.nombre, ejSel)); return { x: +parseYmd(s.fecha), y: Math.max(...e.series.map(x => porTiempo ? x.seg || 0 : x.kg)), e };
  });
  const b = ejSel ? (porTiempo ? mejorTiempo(ejSel) : mejor(ejSel)) : null;
  const est = b ? Math.max(...S.sesiones.flatMap(s => s.ejercicios.filter(e => mismo(e.nombre, ejSel)).flatMap(e => e.series.map(x => rm1(x.kg, x.reps))))) : 0;
  const rut = S.rutinas.map(r => {
    const u = [...S.sesiones].reverse().find(s => s.rutinaId === r.id);
    return `<div class="rut"><div class="grow"><h3>${esc(r.nombre)}</h3><p class="small muted">${r.ejercicios.length} ${r.ejercicios.length === 1 ? "ejercicio" : "ejercicios"}${u ? " · última vez " + fmtFecha(u.fecha) : ""}</p></div>
      <button class="ghost small" data-act="editarRutina" data-id="${r.id}">Editar</button><button class="primary" data-act="empezar" data-id="${r.id}">Empezar</button></div>`;
  }).join("");
  return `
  <header class="top"><h1>Gimnasio</h1></header>
  ${banner()}
  <section class="card">
    <div class="card-head"><span class="eyebrow">Tus rutinas</span><button class="ghost" data-act="editarRutina">+ Nueva</button></div>
    ${rut || `<div class="empty"><p>Armá tus rutinas una vez (Día A, Día B…) y después solo cargás pesos y repeticiones.</p><button class="primary" data-act="editarRutina">Crear rutina</button></div>`}
    <div class="grid2"><button data-act="empezar">Entrenamiento libre</button><button data-act="discos">Calculadora de discos</button></div>
  </section>
  ${tarjetaPlan()}
  ${tarjetaCardio()}
  <section class="card">
    <div class="card-head"><span class="eyebrow">Progreso por ejercicio</span></div>
    ${nombres.length ? `
      <select id="ejSel" aria-label="Ejercicio">${nombres.map(n => `<option ${mismo(n, ejSel || "") ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
      ${ejSel ? `<div class="row small"><span class="pill">${GRUPOS[infoEj(ejSel).grupo]}${porTiempo ? " · por tiempo" : ""}</span><button class="ghost small" data-act="ajustesEj" data-ej="${esc(ejSel)}">Ajustes del ejercicio</button></div>${notaHtml(ejSel)}` : ""}
      ${b && porTiempo ? `<div class="stat"><span class="num">${fmtSeg(b.seg)}</span><span class="lbl">mejor tiempo${b.kg ? ` con ${fmtKg(b.kg)} kg` : ""} · ${fmtFecha(b.fecha)}</span></div>` : ""}
      ${b && !porTiempo ? `<div class="grid2"><div class="stat"><span class="num">${fmtKg(b.kg)} kg</span><span class="lbl">mejor marca · ${b.reps} reps · ${fmtFecha(b.fecha)}</span></div><div class="stat"><span class="num">${fmtKg(est)} kg</span><span class="lbl">1RM estimado (máximo a 1 repetición)</span></div></div>` : ""}
      ${chart(hist, { unit: porTiempo ? "segundos" : "kg", vacio: porTiempo ? "Hacelo dos veces y vas a ver cómo aguantás más." : "Entrená este ejercicio dos veces y vas a ver cómo sube el peso." })}` :
      `<p class="small muted">Cuando registres entrenamientos vas a ver acá el peso máximo de cada ejercicio a lo largo del tiempo.</p>`}
  </section>
  ${tarjetaMusculos()}
  ${tarjetaCalendario()}
  ${tarjetaRendimiento()}
  <section class="card">
    <span class="eyebrow">Historial</span>
    ${S.sesiones.length ? `<div class="list">${[...S.sesiones].reverse().slice(0, 30).map(s => {
      const nSeries = s.ejercicios.reduce((a, e) => a + e.series.length, 0);
      return `<details class="hist li"><summary class="grow"><div class="grow"><p><b>${esc(s.nombre || "Entrenamiento libre")}</b> ${s.prs?.length ? `<span class="pill hot">${s.prs.length} récord${s.prs.length > 1 ? "s" : ""}</span>` : ""}</p><p class="small muted">${fmtFecha(s.fecha, { weekday: "short", day: "numeric", month: "short" })} · ${nSeries} series${s.duracionMin ? " · " + s.duracionMin + " min" : ""}${s.energia ? " · energía " + esc(s.energia) : ""}${s.sueno ? " · " + fmtKg(s.sueno) + " h de sueño" : ""}</p></div><span class="muted">▾</span></summary>
        <div class="det">${s.ejercicios.map(e => `<p><b>${esc(e.nombre)}</b> <span class="muted">${resumenSeries(e.series)}</span></p>`).join("")}
        <div><button class="danger small" data-act="borrarSesion" data-id="${s.id}" data-confirm>Borrar entrenamiento</button></div></div></details>`;
    }).join("")}</div>` : `<p class="small muted">Tus entrenamientos terminados van a quedar acá.</p>`}
  </section>`;
};

function vistaSesion() {
  const d = borrador, hechas = d.ejercicios.reduce((a, e) => a + e.series.filter(s => s.ok).length, 0);
  return `
  <div class="sess-bar"><div><p class="eyebrow">${esc(d.nombre || "Entrenamiento libre")}</p><p class="timer" id="timer">00:00</p></div>
    <button class="primary" data-act="terminar">Terminar</button></div>
  <section class="card">
    ${d.ejercicios.map((e, i) => {
      const u = ultimaVez(e.nombre), b = e.tiempo ? mejorTiempo(e.nombre) : mejor(e.nombre);
      return `<div class="ex">
        <div class="ex-head"><h3>${esc(e.nombre)}</h3>${e.tiempo ? `<span class="pill">Por tiempo</span>` : `<button class="ghost small" data-act="aprox" data-e="${i}">${e.series.some(x => x.tipo === "aprox") ? "Quitar aproximación" : "Aproximación"}</button>`}</div>
        <p class="small muted">${u ? `Última vez (${fmtFecha(u.fecha)}): ${resumenSeries(u.series)}` : "Primera vez con este ejercicio"}${b ? ` · Récord ${e.tiempo ? fmtSeg(b.seg) : fmtKg(b.kg) + " kg"}` : ""}</p>
        ${e.sube ? `<p class="small"><span class="pill good">Subí a ${fmtKg(e.sube)} kg</span> La última vez completaste todas las repeticiones.</p>` : ""}
        ${notaHtml(e.nombre)}
        <div class="set-h"><span>#</span><span>${e.tiempo ? "kg (opc.)" : "kg"}</span><span>${e.tiempo ? "seg" : "reps"}</span><span></span></div>
        ${e.series.map((s, j) => `<div class="set ${s.ok ? "ok" : ""} ${s.tipo || ""}"><span class="n">${etiquetaSerie(e, j)}</span>
          <input id="kg-${i}-${j}" inputmode="decimal" data-e="${i}" data-s="${j}" data-f="kg" value="${esc(s.kg)}" placeholder="${esc(s.phKg)}" aria-label="Kilos serie ${j + 1}">
          <input id="rp-${i}-${j}" inputmode="numeric" data-e="${i}" data-s="${j}" data-f="reps" value="${esc(s.reps)}" placeholder="${esc(s.phReps)}" aria-label="${e.tiempo ? "Segundos" : "Repeticiones"} serie ${j + 1}">
          <button data-act="okSerie" data-e="${i}" data-s="${j}" aria-label="Marcar serie ${j + 1} como hecha">✓</button></div>`).join("")}
        ${e.series.some(x => x.tipo) ? `<p class="small muted">${e.series.some(x => x.tipo === "aprox") ? "A = aproximación: no cuenta para récords ni para el conteo de series. " : ""}${e.series.some(x => x.tipo === "drop") ? "D = drop set: al fallo y sin descanso entre medio." : ""}</p>` : ""}
        <div class="row" style="gap:0"><button class="ghost small" data-act="masSerie" data-e="${i}">+ Serie</button>${e.tiempo ? `<button class="ghost small" data-act="crono" data-e="${i}">Cronómetro</button>` : `<button class="ghost small" data-act="drop" data-e="${i}">${e.series.some(x => x.tipo === "drop") ? "Quitar drops" : "Drop set"}</button><button class="ghost small" data-act="discos" data-e="${i}">Discos</button>`}<button class="ghost small" data-act="ajustesEj" data-ej="${esc(e.nombre)}">Ajustes</button><button class="ghost small" data-act="quitarEj" data-e="${i}" aria-label="Quitar ${esc(e.nombre)}">Quitar</button></div>
      </div>`;
    }).join("") || `<p class="small muted">Agregá el primer ejercicio.</p>`}
  </section>
  <section class="card">
    <form id="fAddEj" class="row"><input class="grow" id="nuevoEj" list="dlEj" placeholder="Agregar ejercicio" aria-label="Agregar ejercicio" style="flex:1"><button type="submit">Agregar</button></form>
    <datalist id="dlEj">${nombresEjercicios().map(n => `<option value="${esc(n)}">`).join("")}</datalist>
  </section>
  <p class="small muted" style="text-align:center">${hechas} series hechas. Si dejás vacío kg o reps, al marcar ✓ se usa lo de la última vez.</p>
  <button class="danger" data-act="descartar" data-confirm>Descartar entrenamiento</button>`;
}

V.fotos = () => {
  const f = S.fotos;
  const hayDosFechas = new Set(f.map(x => x.fecha)).size >= 2;
  if (hayDosFechas) {
    if (!f.some(x => x.id === compA)) {
      // Por defecto: la primera y la última foto de una misma pose que tenga fotos de dos fechas
      const pose = Object.keys(POSES).find(p => new Set(f.filter(x => x.pose === p).map(x => x.fecha)).size >= 2);
      const delaPose = pose ? f.filter(x => x.pose === pose) : f;
      compA = delaPose[0].id; compB = delaPose.at(-1).id;
    }
    const a = f.find(x => x.id === compA), b = f.find(x => x.id === compB);
    if (!b || b.fecha === a.fecha) {
      const otras = [...f].reverse().filter(x => x.fecha !== a.fecha);
      compB = (otras.find(x => x.pose === a.pose) || otras[0]).id;
    }
  } else { compA = compB = null; }
  const A = f.find(x => x.id === compA), B = f.find(x => x.id === compB);
  const opt = (sel, excluirFecha) => [...f].reverse().filter(x => x.id === sel || x.fecha !== excluirFecha).map(x => `<option value="${x.id}" ${x.id === sel ? "selected" : ""}>${fmtFecha(x.fecha, { day: "numeric", month: "short", year: "numeric" })} · ${POSES[x.pose] || ""}</option>`).join("");
  const grupos = {};
  [...f].reverse().forEach(x => (grupos[x.fecha] ||= []).push(x));
  return `
  <header class="top"><h1>Fotos</h1></header>
  ${banner()}
  <section class="card">
    <span class="eyebrow">Nueva foto</span>
    ${estado === "ok" ? `<div class="grid2">
      <label class="f">Fecha<input type="date" id="fFecha" value="${hoy()}" max="${hoy()}"></label>
      <label class="f">Pose<select id="fPose">${Object.entries(POSES).map(([k, t]) => `<option value="${k}">${t}</option>`).join("")}</select></label>
    </div>
    ${navigator.mediaDevices?.getUserMedia ? `<button class="primary block" data-act="camara">Sacar foto con guía</button>` : ""}
    <label class="upl" id="uplLbl">Elegir de la galería<input type="file" id="fFile" accept="image/*"></label>
    <p class="small muted">Tip: misma luz, mismo lugar y misma hora (mejor en ayunas) para que la comparación sea justa.</p>`
    : `<p class="note">${estado === "cargando" ? "Preparando la subida de fotos…" : "Para subir fotos necesitás conexión a internet."}</p>`}
  </section>
  <section class="card">
    <span class="eyebrow">Antes y ahora</span>
    ${A && B ? `<div class="grid2"><label class="f">Antes<select id="cA">${opt(compA)}</select></label><label class="f">Ahora<select id="cB">${opt(compB, A.fecha)}</select></label></div>
      <div class="compare" id="cmp">
        <img src="${esc(B.url)}" alt="Foto del ${fmtFecha(B.fecha)}">
        <img src="${esc(A.url)}" alt="Foto del ${fmtFecha(A.fecha)}" id="cmpTop" style="clip-path:inset(0 ${100 - compPos}% 0 0)">
        <span class="tag" style="left:8px">${fmtFecha(A.fecha)}</span><span class="tag" style="right:8px">${fmtFecha(B.fecha)}</span>
        <div class="divider" id="cmpDiv" style="left:${compPos}%"></div>
      </div>
      <input type="range" id="cmpR" min="0" max="100" value="${compPos}" aria-label="Deslizar para comparar">

function pesoEn(fecha) { let r = null; S.pesos.forEach(p => { if (p.fecha <= fecha) r = p; }); return r || S.pesos[0] || null; }

function guardarBorrador() { if (borrador) ls.set("sesionActiva", borrador); else ls.del("sesionActiva"); }
function nuevaSerie(nombre, i, repsDef) {
  const u = ultimaVez(nombre), us = u ? u.series.filter(x => !x.tipo) : [], s = us[i] || us.at(-1);
  return { kg: "", reps: "", ok: false, phKg: s ? fmtKg(s.kg) : "", phReps: s ? String(s.seg || s.reps) : (repsDef ? String(repsDef) : "") };
}
function ejercicioBorrador(nombre, nSeries, reps) {
  const u = ultimaVez(nombre), us = u ? u.series.filter(x => !x.tipo) : [], n = nSeries || us.length || 3;
  const e = { nombre, reps, series: Array.from({ length: n }, (_, i) => nuevaSerie(nombre, i, reps)) };
  if (infoEj(nombre).tiempo) { e.tiempo = true; e.series.forEach(x => { if (x.phKg === "0") x.phKg = ""; }); return e; }
  if (us.length && reps && us.length >= n && us.every(s => s.reps >= reps)) {
    const top = Math.max(...us.map(s => s.kg));
    if (top > 0) { e.sube = top + 2.5; e.series.forEach(s => s.phKg = fmtKg(e.sube)); }
  }
  return e;
}

/* temporizador de descanso y pantalla encendida */
function iniciarDescanso(forzado) {
  const seg = forzado ?? S.cfg.descanso ?? 90; if (!seg) return;
  descanso = { fin: Date.now() + seg * 1000, sonado: false };
  try { actx ||= new (window.AudioContext || window.webkitAudioContext)(); actx.resume?.(); } catch {}
  clearInterval(restId); restId = setInterval(dibujarDescanso, 250); dibujarDescanso();
}
function dibujarDescanso() {
  let el = $("#rest");
  if (!descanso) { el?.remove(); clearInterval(restId); return; }
  const r = Math.ceil((descanso.fin - Date.now()) / 1000);
  if (!el) {
    el = document.createElement("div"); el.id = "rest"; el.className = "rest";
    el.innerHTML = `<div class="in" role="timer"><span class="t"></span><span class="grow small lbl"></span><button data-act="restMas">+15 s</button><button data-act="restFin">Listo</button></div>`;
    document.body.appendChild(el);
  }
  el.classList.toggle("fin", r <= 0);
  el.querySelector(".t").textContent = r > 0 ? `${Math.floor(r / 60)}:${String(r % 60).padStart(2, "0")}` : "¡Ya!";
  el.querySelector(".lbl").textContent = r > 0 ? "Descanso" : "A la próxima serie";
  if (r <= 0 && !descanso.sonado) { descanso.sonado = true; beep(); try { navigator.vibrate?.([200, 100, 200]); } catch {} }
  if (r <= -30) { descanso = null; dibujarDescanso(); }
}
function beep() {
  if (!actx) return;
  try {
    [0, 0.25, 0.5].forEach((t, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + t;
      o.frequency.value = i === 2 ? 1320 : 880;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + 0.22);
    });
  } catch {}
}
async function mantenerPantalla() { try { if (!wake || wake.released) wake = await navigator.wakeLock?.request("screen"); } catch {} }
function soltarPantalla() { try { wake?.release(); } catch {} wake = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && borrador) mantenerPantalla(); });

async function achicar(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
    const max = 1400, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(ok => c.toBlob(b => ok(b || file), "image/jpeg", 0.85));
  } catch { return file; } finally { URL.revokeObjectURL(url); }
}
async function subirFoto(file) {
  const lbl = $("#uplLbl"); if (lbl) lbl.firstChild.textContent = "Subiendo…";
  const fecha = $("#fFecha")?.value || hoy(), pose = $("#fPose")?.value || "frente";
  try {
    const antes = medallasOn();
    const blob = await achicar(file);
    const r = await assets.upload(blob, { type: blob.type || "image/jpeg" });
    await guardar("fotos", { id: nid(), fecha, pose, assetId: r.id, url: r.url });
    render(); toast("Foto guardada"); avisarMedallas(antes);
  } catch (e) {
    if (e?.code !== "login") toast(e?.code === "red" ? "Sin señal: las fotos se suben solo con internet." : e?.code === 413 ? "La foto es muy pesada. Probá con otra." : "No se pudo subir la foto. Probá de nuevo.");
    if (lbl) lbl.firstChild.textContent = "Elegir de la galería";
  }
}

Object.assign(A, {

    t.disabled = true;

      const { publicKey } = await apiFetch("/api/vapid");
      const sub = await swReg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8(publicKey) });

/* ---------- calendario del año ---------- */
function tarjetaCalendario() {
  const gym = new Set(S.sesiones.map(s => s.fecha)), car = new Set(S.cardio.map(c => c.fecha));
  const fin = new Date(), ini = lunes(new Date(fin.getFullYear(), fin.getMonth(), fin.getDate() - 52 * 7));
  const cel = 11, gap = 3, x0 = 16, y0 = 14, semanas = Math.floor((lunes(fin) - ini) / (7 * 864e5)) + 1;
  let rects = "", meses = "", mesPrev = -1, total = 0;
  for (let w = 0; w < semanas; w++) for (let d = 0; d < 7; d++) {
    const dt = new Date(ini); dt.setDate(ini.getDate() + w * 7 + d);
    if (dt > fin) continue;
    const k = ymd(dt), g = gym.has(k), c = car.has(k);
    if (g || c) total++;
    if (d === 0 && dt.getMonth() !== mesPrev && w < semanas - 2) { mesPrev = dt.getMonth(); meses += `<text x="${x0 + w * (cel + gap)}" y="9">${dt.toLocaleDateString("es-UY", { month: "short" }).replace(".", "")}</text>`; }
    rects += `<rect x="${x0 + w * (cel + gap)}" y="${y0 + d * (cel + gap)}" width="${cel}" height="${cel}" rx="2" class="${g ? "hg" : c ? "hc" : "h0"}"><title>${fmtFecha(k, { day: "numeric", month: "short", year: "numeric" })}${g ? " · gimnasio" : c ? " · cardio" : ""}</title></rect>`;
  }
  const W = x0 + semanas * (cel + gap), H = y0 + 7 * (cel + gap);
  const dias = [[0, "L"], [2, "M"], [4, "V"]].map(([i, t]) => `<text x="0" y="${y0 + i * (cel + gap) + 9}">${t}</text>`).join("");
  return `<section class="card"><div class="card-head"><span class="eyebrow">Tu año</span><span class="pill">${total} ${total === 1 ? "día entrenado" : "días entrenados"}</span></div>
    <div class="heat"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Días entrenados en los últimos 12 meses">${meses}${dias}${rects}</svg></div>
    <div class="row small muted"><span class="lg hg"></span>Gimnasio<span class="lg hc"></span>Solo cardio<span class="lg h0"></span>Sin entrenar</div></section>`;
}

/* ---------- calculadora de discos ---------- */
const DISCOS = [25, 20, 15, 10, 5, 2.5, 1.25];
const fmtDisco = n => (Math.round(n * 100) / 100).toLocaleString("es-UY", { maximumFractionDigits: 2 });
let barraKg = ls.get("barra", 20);
function calcularDiscos(total, barra) {
  let resto = Math.round((total - barra) / 2 * 100) / 100;
  if (resto < 0) return null;
  const lado = [];
  for (const d of DISCOS) while (resto >= d - 1e-9) { lado.push(d); resto = Math.round((resto - d) * 100) / 100; }
  return { lado, sobra: Math.round(resto * 2 * 100) / 100 };
}
function dibujarDiscos() {
  const el = $("#dRes"); if (!el) return;
  const total = num($("#dKg").value), barra = +$("#dBarra").value;
  if (!total) { el.innerHTML = `<p class="small muted">Poné el peso total que querés levantar, contando la barra.</p>`; return; }
  const r = calcularDiscos(total, barra);
  if (!r) { el.innerHTML = `<p class="small muted">Ese peso es menor que la barra sola (${barra} kg).</p>`; return; }
  el.innerHTML = `<p class="small muted">${barra ? "En cada lado de la barra:" : "En cada lado:"}</p>
    <div class="barra">${barra ? `<span class="eje"></span>` : ""}${r.lado.map(d => `<span class="disco" style="height:${44 + d / 25 * 90}px">${fmtDisco(d)}</span>`).join("") || `<span class="small muted">Sin discos: solo la barra.</span>`}</div>
    ${r.lado.length ? `<p><b>${r.lado.map(fmtDisco).join(" + ")} kg</b> por lado</p>` : ""}
    ${r.sobra ? `<p class="small muted">Con discos comunes no llegás exacto: te quedan ${fmtDisco(r.sobra)} kg sin cargar, o sea ${fmtDisco(total - r.sobra)} kg en total.</p>` : ""}`;
}

/* ---------- compartir logros ---------- */
let imagenActual = null, ultimoResumen = null;
function dibujarPesa(x, cx, cy, s) {
  x.fillStyle = "#D8B24A";
  const r = (X, Y, W, H) => { x.beginPath(); const a = [cx + (X - 256) * s, cy + (Y - 256) * s, W * s, H * s]; x.roundRect ? x.roundRect(...a, 10 * s) : x.rect(...a); x.fill(); };
  r(132, 160, 44, 192); r(336, 160, 44, 192); r(96, 200, 32, 112); r(384, 200, 32, 112); r(172, 238, 168, 36);
}
function lineas(x, texto, ancho) {
  const out = []; let linea = "";
  for (const p of String(texto).split(" ")) { const t = linea ? linea + " " + p : p; if (x.measureText(t).width > ancho && linea) { out.push(linea); linea = p; } else linea = t; }
  if (linea) out.push(linea);
  return out;
}
async function imagenLogro({ titulo, grande, unidad, detalle, fecha }) {
  try { await Promise.all([document.fonts.load('700 200px "Barlow Condensed"'), document.fonts.load('500 40px "Figtree"')]); } catch {}
  const c = document.createElement("canvas"); c.width = 1080; c.height = 1920;
  const x = c.getContext("2d");
  x.fillStyle = "#0A0A0B"; x.fillRect(0, 0, 1080, 1920);
  x.strokeStyle = "#D8B24A"; x.lineWidth = 6; x.strokeRect(60, 60, 960, 1800);
  x.textAlign = "center";
  x.fillStyle = "#D8B24A"; x.font = '700 64px "Barlow Condensed", "Arial Narrow", sans-serif';
  x.fillText(titulo.toUpperCase(), 540, 560);
  let size = 360; x.font = `700 ${size}px "Barlow Condensed", "Arial Narrow", sans-serif`;
  while (x.measureText(grande).width > 860 && size > 120) { size -= 10; x.font = `700 ${size}px "Barlow Condensed", "Arial Narrow", sans-serif`; }
  x.fillStyle = "#F3EEE2"; const yG = 600 + size * 0.85; x.fillText(grande, 540, yG);
  let y = yG + 30;
  if (unidad) { x.fillStyle = "#D8B24A"; x.font = '700 92px "Barlow Condensed", "Arial Narrow", sans-serif'; y += 92; x.fillText(unidad.toUpperCase(), 540, y); }
  x.fillStyle = "#F3EEE2"; x.font = '500 50px "Figtree", sans-serif'; y += 60;
  for (const l of lineas(x, detalle, 840)) { y += 66; x.fillText(l, 540, y); }
  if (fecha) { x.fillStyle = "#9E988A"; x.font = '500 40px "Figtree", sans-serif'; y += 70; x.fillText(fecha, 540, y); }
  dibujarPesa(x, 540, 1560, 0.55);
  x.fillStyle = "#D8B24A"; x.font = '700 60px "Barlow Condensed", "Arial Narrow", sans-serif'; x.fillText("FIERRO Y BALANZA", 540, 1720);
  return new Promise(ok => c.toBlob(ok, "image/png"));
}
async function mostrarImagen(datos, texto) {
  toast("Armando la imagen…");
  const blob = await imagenLogro(datos);
  if (!blob) { toast("No se pudo armar la imagen."); return; }
  if (imagenActual?.url) URL.revokeObjectURL(imagenActual.url);
  imagenActual = { blob, url: URL.createObjectURL(blob), texto, nombre: `fierro-y-balanza-${hoy()}.png` };

let infDesde = null;
function datosInforme(desde) {
  const h = hoy();
  const pesos = S.pesos.filter(p => p.fecha >= desde), ses = S.sesiones.filter(s => s.fecha >= desde), car = S.cardio.filter(c => c.fecha >= desde);
  const dias = new Set([...ses.map(s => s.fecha), ...car.map(c => c.fecha)]).size;
  const semanas = Math.max(1, (parseYmd(h) - parseYmd(desde)) / (7 * 864e5));
  const conSueno = ses.filter(s => s.sueno), sueno = conSueno.length ? conSueno.reduce((a, s) => a + s.sueno, 0) / conSueno.length : null;
  const energia = { alta: 0, media: 0, baja: 0 }; ses.forEach(s => { if (energia[s.energia] !== undefined) energia[s.energia]++; });
  const prs = ses.flatMap(s => (s.prs || []).map(p => ({ ...p, fecha: s.fecha })));
  const sem = promediosSemanales().filter(w => w.semana >= ymd(lunes(parseYmd(desde))));
  return { desde, h, pesos, ses, car, dias, porSemana: dias / semanas, sueno, nSueno: conSueno.length, energia, prs, sem, cardioMin: car.reduce((a, c) => a + (c.minutos || 0), 0) };
}

});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && cola.get().length) vaciarCola().then(ok => ok && render()); });


/* ---------- grupos musculares y ejercicios por tiempo ---------- */
const GRUPOS = { pecho: "Pecho", espalda: "Espalda", hombros: "Hombros", biceps: "Bíceps", triceps: "Tríceps", piernas: "Piernas", gluteos: "Glúteos", core: "Core / abdomen", otro: "Otro" };
// El orden importa: lo más específico primero ("curl femoral" es pierna, "patada de tríceps" es tríceps)
const REGLAS_GRUPO = [
  [/plancha/, "core"],
  [/tr[ií]ceps|franc[eé]s|fondos|press cerrado|rompecr[aá]neos/, "triceps"],
  [/femoral|curl (de )?pierna|curl acostado|curl sentado|isquio/, "piernas"],
  [/b[ií]ceps|curl|martillo|predicador|scott/, "biceps"],
  [/hip thrust|gl[uú]te|puente|patada|abducci|abductor|kickback/, "gluteos"],
  [/sentadilla|prensa|squat|zancada|estocada|b[uú]lgara|extensi[oó]n de (piernas|cu[aá]driceps)|cu[aá]driceps|gemelo|pantorrilla|aductor|hack|rumano|leg press|step/, "piernas"],
  [/jal[oó]n|remo|dominada/, "espalda"],
  [/press (de )?banca|banco plano|inclinad|declinad|pecho|apertura|pec ?deck|cruce|crossover|flexiones|lagartija/, "pecho"],
  [/militar|hombro|lateral|frontal|p[aá]jaro|vuelos|face ?pull|arnold|deltoide/, "hombros"],
  [/remo|dominada|jal[oó]n|pull|dorsal|espalda|peso muerto|serrucho|pullover|lumbar|hiperextensi/, "espalda"],
  [/plancha|abdominal|abs\b|crunch|core|rueda|oblicuo|hollow|elevaci[oó]n de piernas|russian|bicho|superman/, "core"]
];
const REGLA_TIEMPO = /plancha|isom[eé]tric|wall sit|(sentadilla|silla) (en|contra la) pared|hollow|dead hang|soga|l-sit|superman/;
function infoEj(nombre) {
  const guardado = S.ejercicios.find(x => x.id === slug(nombre));
  if (guardado) return { grupo: GRUPOS[guardado.grupo] ? guardado.grupo : "otro", tiempo: !!guardado.tiempo, guardado: true };
  const n = String(nombre).toLowerCase();
  return { grupo: (REGLAS_GRUPO.find(([re]) => re.test(n)) || [, "otro"])[1], tiempo: REGLA_TIEMPO.test(n) };
}
function tarjetaMusculos() {
  if (!S.sesiones.length) return "";
  const desde = ymd(new Date(Date.now() - 6 * 864e5));
  const cuenta = Object.fromEntries(Object.keys(GRUPOS).map(k => [k, 0]));
  S.sesiones.filter(s => s.fecha >= desde).forEach(s => s.ejercicios.forEach(e => { cuenta[infoEj(e.nombre).grupo] += e.series.filter(contable).length; }));
  const filas = Object.keys(GRUPOS).filter(k => k !== "otro" || cuenta.otro);
  const total = filas.reduce((a, k) => a + cuenta[k], 0);
  const sinSeries = filas.filter(k => k !== "otro" && !cuenta[k]).map(k => GRUPOS[k]);
  const max = Math.max(20, ...filas.map(k => cuenta[k]));
  return `<section class="card"><div class="card-head"><span class="eyebrow">Series por músculo</span><span class="pill">últimos 7 días</span></div>
    ${total && sinSeries.length ? `<p class="small">Sin trabajar: <b style="color:var(--accent)">${sinSeries.join(", ")}</b></p>` : ""}
    ${total ? filas.map(k => `<div class="goal"><div class="row small"><span class="${cuenta[k] ? "" : "muted"}">${GRUPOS[k]}</span><b class="${cuenta[k] ? "" : "muted"}">${cuenta[k]} ${cuenta[k] === 1 ? "serie" : "series"}</b></div>
      <div class="bar ${cuenta[k] >= 10 ? "good" : ""}"><i style="width:${cuenta[k] / max * 100}%"></i></div></div>`).join("")
      : `<p class="small muted">No entrenaste en los últimos 7 días.</p>`}
    <p class="small muted">Como referencia general, muchas guías sugieren entre 10 y 20 series por semana para cada grupo. El grupo de cada ejercicio se adivina por el nombre; si está mal, cambialo en Ajustes del ejercicio.</p></section>`;
}
let ajEj = null;
let crono = null, cronoId = null;
function dibujarCrono() {
  let el = $("#crono");
  if (!crono) { el?.remove(); clearInterval(cronoId); return; }
  const seg = Math.floor((Date.now() - crono.inicio) / 1000);
  if (!el) {
    el = document.createElement("div"); el.id = "crono"; el.className = "rest";
    el.innerHTML = `<div class="in" role="timer"><span class="t"></span><span class="grow small lbl"></span><button data-act="cronoCancelar">Cancelar</button><button data-act="cronoParar">Listo</button></div>`;
    document.body.appendChild(el);
  }
  el.querySelector(".t").textContent = `${Math.floor(seg / 60)}:${String(seg % 60).padStart(2, "0")}`;
  const e = borrador?.ejercicios[crono.i];
  el.querySelector(".lbl").textContent = `${e?.nombre || ""} · serie ${crono.j + 1}${crono.objetivo ? ` · objetivo ${fmtSeg(crono.objetivo)}` : ""}`;
  if (crono.objetivo && seg >= crono.objetivo && !crono.sonado) { crono.sonado = true; el.classList.add("fin"); beep(); try { navigator.vibrate?.([200, 100, 200]); } catch {} }
}
Object.assign(A, {
  crono(t) {
    const i = +t.dataset.e, e = borrador.ejercicios[i], j = e.series.findIndex(x => !x.ok);
    if (j < 0) { toast("Ya marcaste todas las series. Agregá otra con + Serie."); return; }
    const obj = num(e.series[j].reps || e.series[j].phReps);
    try { actx ||= new (window.AudioContext || window.webkitAudioContext)(); actx.resume?.(); } catch {}
    descanso = null; dibujarDescanso();
    crono = { i, j, inicio: Date.now(), objetivo: obj > 0 ? obj : null, sonado: false };
    clearInterval(cronoId); cronoId = setInterval(dibujarCrono, 200); dibujarCrono();
  },
  cronoParar() {
    if (!crono || !borrador) return;
    const seg = Math.max(1, Math.floor((Date.now() - crono.inicio) / 1000)), s = borrador.ejercicios[crono.i]?.series[crono.j];
    crono = null; dibujarCrono();
    if (!s) return;
    s.reps = String(seg); if (s.kg === "") s.kg = s.phKg || "0"; s.ok = true;
    guardarBorrador(); render(); iniciarDescanso(); toast(`Serie guardada: ${fmtSeg(seg)}`);
  },
  cronoCancelar() { crono = null; dibujarCrono(); },
  ajustesEj(t) {
    ajEj = t.dataset.ej; const inf = infoEj(ajEj), n = notaDe(ajEj);
    sheet(`<h2>${esc(ajEj)}</h2>
      <div class="grid2"><label class="f">Grupo muscular<select id="ajGrupo">${Object.entries(GRUPOS).map(([k, v]) => `<option value="${k}" ${k === inf.grupo ? "selected" : ""}>${v}</option>`).join("")}</select></label>
        <label class="f">Se registra en<select id="ajTipo"><option value="reps" ${inf.tiempo ? "" : "selected"}>Repeticiones</option><option value="tiempo" ${inf.tiempo ? "selected" : ""}>Segundos</option></select></label></div>
      ${inf.guardado ? "" : `<p class="small muted">Lo elegí según el nombre del ejercicio. Si no es así, cambialo.</p>`}
      <label class="f">Nota<textarea id="nTexto" rows="3" maxlength="500" placeholder="Ej.: molestia en el hombro, agarre más cerrado, asiento en el 4">${esc(n?.texto || "")}</textarea></label>
      <p class="small muted">La nota aparece cada vez que hacés este ejercicio. Con "Segundos" tenés un cronómetro en cada serie, ideal para plancha o isométricos.</p>
      <div class="row"><button class="grow" data-act="cerrar">Cancelar</button><button class="primary grow" data-act="guardarAjustesEj">Guardar</button></div>`);
  },
  async guardarAjustesEj() {
    const grupo = $("#ajGrupo").value, tiempo = $("#ajTipo").value === "tiempo", texto = $("#nTexto").value.trim(), id = slug(ajEj), n = notaDe(ajEj);
    cerrarSheet();
    try {
      await guardar("ejercicios", { id, nombre: ajEj, grupo, tiempo });
      if (texto && texto !== n?.texto) await guardar("notas", { id, ejercicio: ajEj, texto, fecha: hoy() });
      else if (!texto && n) await borrar("notas", id);
    } catch { return; }
    if (borrador) {
      borrador.ejercicios.forEach(e => {
        if (!mismo(e.nombre, ajEj) || !!e.tiempo === tiempo) return;
        e.tiempo = tiempo; delete e.sube;
        e.series.forEach(x => { if (!x.ok) x.phReps = ""; });
      });
      guardarBorrador();
    }
    render(); toast("Ejercicio guardado");
  }
});


/* ---------- series de aproximación y drop sets ---------- */
function contable(x) { return x.tipo !== "aprox"; }
function etiquetaSerie(e, j) {
  const t = e.series[j].tipo, n = e.series.slice(0, j + 1).filter(x => (x.tipo || "") === (t || "")).length;
  return t === "aprox" ? "A" + n : t === "drop" ? "D" + n : String(n);
}
// 50 % × 8, 70 % × 5 y 85 % × 2 del peso de trabajo, redondeado a lo que se puede cargar
function calcularAprox(obj) {
  const paso = obj >= 20 ? 2.5 : 1, red = x => Math.round(x / paso) * paso, plan = [];
  for (const [p, r] of [[0.5, 8], [0.7, 5], [0.85, 2]]) {
    const k = red(obj * p);
    if (k > 0 && k < obj && (!plan.length || k > plan.at(-1)[0])) plan.push([k, r]);
  }
  return plan;
}
function calcularDrops(base, pct, n) {
  const out = []; let k = base;
  for (let i = 0; i < n; i++) {
    const paso = k >= 20 ? 2.5 : 1, nk = Math.round(k * (1 - pct / 100) / paso) * paso;
    if (nk <= 0 || nk >= k) break;
    out.push(nk); k = nk;
  }
  return out;
}
Object.assign(A, {
  aprox(t) {
    const e = borrador.ejercicios[+t.dataset.e];
    if (e.series.some(x => x.tipo === "aprox")) { e.series = e.series.filter(x => x.tipo !== "aprox"); guardarBorrador(); render(); return; }
    const primera = e.series.find(x => !x.tipo), obj = num(primera?.kg || primera?.phKg || "");
    if (!obj) { toast("Poné primero el peso de tu primera serie de trabajo."); $(`#kg-${t.dataset.e}-${e.series.indexOf(primera)}`)?.focus(); return; }
    const plan = calcularAprox(obj);
    if (!plan.length) { toast("Con ese peso no hace falta aproximación."); return; }
    e.series = [...plan.map(([kg, reps]) => ({ tipo: "aprox", kg: "", reps: "", ok: false, phKg: fmtKg(kg), phReps: String(reps) })), ...e.series];
    guardarBorrador(); render();
    toast(`Aproximación para ${fmtKg(obj)} kg: ${plan.map(([kg, r]) => `${fmtKg(kg)}×${r}`).join(", ")}`);
  },
  drop(t) {
    const e = borrador.ejercicios[+t.dataset.e];
    if (e.series.some(x => x.tipo === "drop")) { e.series = e.series.filter(x => x.tipo !== "drop"); guardarBorrador(); render(); return; }
    const ult = e.series.filter(x => !x.tipo).reverse().find(x => num(x.kg || x.phKg || "")), base = num(ult?.kg || ult?.phKg || "");
    if (!base) { toast("Poné primero el peso de tu última serie."); return; }
    const kgs = calcularDrops(base, S.cfg.dropPct ?? 20, S.cfg.dropN ?? 2);
    if (!kgs.length) { toast("Con ese peso no se puede bajar más."); return; }
    const reps = ult.reps || ult.phReps || "";
    e.series.push(...kgs.map(kg => ({ tipo: "drop", kg: "", reps: "", ok: false, phKg: fmtKg(kg), phReps: String(reps) })));
    guardarBorrador(); render();
    toast(`Drops: ${fmtKg(base)} → ${kgs.map(fmtKg).join(" → ")} kg, sin descanso entre medio`);
  }
});

iniciar();
</script>
